name: Publish Extension

on:
  release:
    types: [published] # Triggers only when you click "Publish Release" on GitHub

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Package VSIX
        run: npx @vscode/vsce package

      - name: Upload VSIX to GitHub Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Marketplace
        # This uses the secret you just saved in GitHub Settings
        # --pre-release flag for beta releases
        run: |
          if [[ "${{ github.event.release.prerelease }}" == "true" ]]; then
            npx @vscode/vsce publish --pre-release -p ${{ secrets.VSCE_PAT }}
          else
            npx @vscode/vsce publish -p ${{ secrets.VSCE_PAT }}
          fi
